[package]
name = "bitvmx-transaction-monitor"
version = "0.8.4"
edition = "2021"
description = "Monitor"
keywords = ["bitcoin", "monitor", "bitcoin transactions"]
repository = "https://github.com/fairgateLabs/rust-bitvmx-transaction-monitor"
readme = "README.md"
license = "MIT"
categories = ["cryptocurrency", "monitoring"]

[dependencies]
bitcoin-indexer = { git = "https://github.com/FairgateLabs/rust-bitcoin-indexer.git", tag = "v0.8.4" }
bitvmx-settings = { git = "https://github.com/FairgateLabs/rust-bitvmx-settings.git", tag = "v0.8.4" }
rust-bitvmx-storage-backend = { git = "https://github.com/FairgateLabs/rust-bitvmx-storage-backend.git", tag = "v0.8.4" }
bitvmx-bitcoin-rpc = { git = "https://github.com/FairgateLabs/rust-bitvmx-bitcoin-rpc.git", tag = "v0.8.4" }
bitcoin = "0.32.102"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
anyhow = "1.0.104"
thiserror = "2.0.20"
mockall = "0.15.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
hex = "0.4"

[dev-dependencies]
bitcoind = { git = "https://github.com/FairgateLabs/rust-bitcoind.git", tag = "v0.8.4" }
bitcoincore-rpc = "0.19"
